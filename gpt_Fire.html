<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
    width: 100%;
    height: 100%;
}

canvas {
    display: block;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>

const simW = 640;
const simH = 360;


const flame = [];
for (let x = 0; x < simW; x++) {
    flame[x] = new Array(simH).fill(0);
}

// bottom row heat
for (let x = 0; x < simW; x++)
    flame[x][simH - 1] = 255;


const fireCanvas = document.createElement("canvas");
fireCanvas.width = simW;
fireCanvas.height = simH;
const fireCtx = fireCanvas.getContext("2d");
const fireImg = fireCtx.createImageData(simW, simH);


const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

ctx.imageSmoothingEnabled = false;


function updateFire() {
    for (let w = simW - 1; w >= 0; w--) {
        for (let h = simH - 2; h >= 0; h--) {

            let pixelDown = flame[w][h + 1];
            let decay = Math.floor(Math.random() * 3);
            let shift = Math.floor(Math.random() * 2);
            let direction = Math.random() < 0.5 ? -1 : 1;

            let final_offset = w + shift * direction;
            if (final_offset >= simW) final_offset = simW - 1;
            if (final_offset < 0) final_offset = 0;

            let value = pixelDown - decay;
            if (value < 0) value = 0;

            flame[final_offset][h] = value;
        }
    }
}


function renderFire() {
    let ptr = 0;
    for (let h = 0; h < simH; h++) {
        for (let w = 0; w < simW; w++) {

            let v = flame[w][h];
            if (v > 255) v = 255;

            fireImg.data[ptr++] = v;
            fireImg.data[ptr++] = 0;
            fireImg.data[ptr++] = v;
            fireImg.data[ptr++] = 255;
        }
    }

    fireCtx.putImageData(fireImg, 0, 0);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(
        fireCanvas,
        0, 0,
        canvas.width,
        canvas.height
    );
}


function loop() {
    updateFire();
    renderFire();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
